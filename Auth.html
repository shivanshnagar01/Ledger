<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger.</title>
    <style>

        @view-transition {
  navigation: auto;
}

        body {
            background-color: #10151d;
            color: #f3eee1;
        }

        .just{
            justify-self: center;
        }

        .fran {
            font-family: 'Fraunces';
        }

        .jet {
            font-family: 'JetBrains Mono';
        }

        .dot {
            color: #d6a857;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 600;
            position: absolute;
            left: 0;
        }

        .upper {
            /* background-color: white; */
            width: 80vw;
            margin-top: 2%;
            justify-self: center;
            display: flex;
            position: relative;
            justify-content: center;
            /* align-items: center; */
        }

        .heading {
            font-size: 40px;
            margin-top: 20px;
        }

        .Main-card {
            background-color: #f3eee1;
            width: 25vw;
            padding: 10px;
            height: 30vw;
            margin-top: 5%;
            justify-self: center;
            border-radius: 15px;
            box-shadow: inset 0px -10px 15px rgb(107, 107, 107);
            color: #10151d;
        }

        .process-name {
            font-size: 24px;
            justify-self: center;
            /* text-decoration: underline; */
            /* text-underline-offset: 5px; */
            border-bottom: 2px solid black;
            height: 35px;
            width: 80%;
            text-align: center;
        }

.details{
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-left: 20px;
    margin-top: 50px;
}

.grp{
    display: flex;
    flex-direction: column;
    gap: 5px;
}

        .tile{
            font-size: 14px;
        }

        input{
            width: 90%;
            border: 1px solid grey;
            border-radius: 5px;
            height: 25px;
            font-size: 12px;
            transition: 0.3s;
        }
        
        .forgotpass{
            cursor: pointer;
            margin-top: 30px;
        }

        .btn{
            font-size: 20px;
            justify-self: center;
            padding: 10px 20px;
            color: white;
            border-radius: 5px;
            /* margin-top: 10px; */
            background-color: #10151d;
            cursor: pointer;
        }

        .buttongrp{
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
            /* justify-content: center; */
            margin-top: 10px;
            width: 60%;
            justify-self: center;
        }

        .next{
            background-color: #10151d;
        }

        .google{
            font-size: 18px;
        }

        .haveacc{
            justify-self: center;
            margin-top: 30px;
        }

        .haveacc{
            cursor: pointer;
        }

        .opt{
            font-size: 14px;
            opacity: 0;
        }

          ::-webkit-scrollbar{
      display: none;
    }
        
    </style>
</head>

<body>
    <div class="upper">
        <div class="logo fran">Ledger<span class="dot">.</span></div>
        <div class="heading fran">Start Ledging.</div>
    </div>
    <div class="Main-card">
        <div class="process-name fran">Sign Up</div>
        <div class="details">
            <div class="grp">
                <div class="tile utile jet">Username <span class="opt">( Optional )</span></div>
                <input id="username" type="text" class="username">
            </div>
            <div class="grp">
                <div class="tile jet">Email</div>
                <input id="email" type="email" class="mail">
            </div>
            <div class="grp">
                <div class="tile jet">Password</div>
                <input id="password" type="email" class="pass">
            </div>
        </div>
        <div class="forgotpass just">Forgot password?</div>
        <div class="buttongrp">
            <div id="next" class="btn next fran">Sign Up</div>
            <!-- <div class="btn google fran">Continue with Google</div> -->
        </div>
        <div class="haveacc">Have an account?<span class="toggle"> Login</span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</body>

</html>
